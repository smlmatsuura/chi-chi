<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="自分磨き">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>自分磨き手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F4; --card:#FFFFFF; --ink:#222; --sub:#5E5E5E; --line:#E3DED5; --line2:#CFC9BE;
  --ac:#4F6B56; --ac-soft:#E5ECE6; --ac-mid:#9DB3A2; --warn:#A0442C;
  --mincho:'Shippori Mincho',serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
input,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 24px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
header.top h1{font-family:var(--mincho);font-size:22px;margin:0;letter-spacing:.06em}
.status{font-size:12px;color:var(--sub);min-height:16px;text-align:right}
.banner{background:#F4EFE4;border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--sub);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:400;color:var(--sub);font-size:12px}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datebar .d{font-family:var(--mincho);font-size:22px;font-weight:700;letter-spacing:.04em}
.datebar .d small{font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;color:var(--sub);font-weight:500;margin-left:6px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:disabled{opacity:.35}
.prompt{border:1.5px solid var(--ac);background:var(--card)}
.prompt .label{font-size:12px;font-weight:700;color:var(--ac);letter-spacing:.1em}
.prompt .q{font-family:var(--mincho);font-size:19px;font-weight:700;margin:6px 0 10px;line-height:1.45}
textarea{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-height:84px;resize:vertical;background:#FFFEFC;line-height:1.6;font-size:16px}
textarea.short{min-height:56px}
input[type=text],input[type=number],input[type=date]{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:#FFFEFC;font-size:16px;min-height:44px}
input:focus,textarea:focus{outline:2px solid var(--ac-mid);outline-offset:1px;border-color:var(--ac)}
.linkbtn{background:none;border:none;color:var(--ac);font-size:13px;font-weight:700;padding:8px 4px;cursor:pointer;min-height:36px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:500}
.unit{position:relative}
.unit input{padding-right:40px}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--sub);pointer-events:none}
.moods{display:flex;gap:8px}
.moods button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line2);background:#FFFEFC;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--sub)}
.moods button svg{width:22px;height:22px}
.moods button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.cups{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cups button{width:36px;height:44px;border:none;background:none;padding:0;cursor:pointer}
.cups .cnt{font-size:13px;color:var(--sub);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line2);background:#FFFEFC;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.chip .box{width:16px;height:16px;border:1.5px solid currentColor;border-radius:4px;display:flex;align-items:center;justify-content:center}
.meals .field{margin:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(250,248,244,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;background:none;border:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub);cursor:pointer;min-height:58px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--ac);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--ac-soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--mincho);font-size:22px;color:var(--ink)}
.stat span{font-size:11px;color:var(--sub)}
.chart{width:100%;height:auto;display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--sub);text-align:center;padding:2px 0}
.cal button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:#FFFEFC;font-size:12px;cursor:pointer;position:relative;padding:0}
.cal button.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .empty{visibility:hidden}
.ibgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ib{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#FFFEFC}
.ib .k{font-size:12px;color:var(--sub)}
.ib .v{font-family:var(--mincho);font-size:22px;font-weight:700;margin-top:2px}
.ib .v small{font-family:'Zen Kaku Gothic New',sans-serif;font-size:12px;font-weight:500;color:var(--sub);margin-left:2px}
.ib .d{font-size:12px;font-weight:700;margin-top:2px}
.good{color:#2F6B45}.bad{color:#A0442C}.flat{color:var(--sub)}
.mchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.mchips button{flex:none;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:#FFFEFC;font-size:13px;cursor:pointer}
.mchips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.filebtn{display:inline-flex;align-items:center;position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}
.adv{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.adv:last-child{border-bottom:none}
.adv .ic{flex:none;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.adv.good .ic{background:#E1EDE4;color:#2F6B45}
.adv.tip .ic{background:#EFECE6;color:#222}
.adv.warn .ic{background:#F6E3DC;color:#A0442C}
.adv b{display:block;font-size:14px;margin-bottom:2px}
.adv p{margin:0;font-size:13px;line-height:1.6;color:#3A3A3A}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line2);background:#FFFEFC;cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.legend{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.vq{font-size:14px;font-weight:700;margin:12px 0 6px;display:flex;gap:8px}
.vq em{font-style:normal;font-family:var(--mincho);color:var(--ac)}
.habit-row{display:flex;gap:8px;margin-bottom:8px}
.habit-row input{flex:1}
.delbtn{width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line2);background:#FFFEFC;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--ac);background:var(--ac);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:#FFFEFC;color:var(--ac)}
table.body{width:100%;border-collapse:collapse;font-size:13px}
table.body th,table.body td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:right}
table.body th:first-child,table.body td:first-child{text-align:left}
table.body th{font-size:11px;color:var(--sub);font-weight:500}
.scroll{overflow-x:auto}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.plist li .n{font-family:var(--mincho);font-weight:700;color:var(--ac);width:24px;flex:none}
.plist li .ok{margin-left:auto;font-size:11px;color:var(--ac);font-weight:700;flex:none}
.range{width:100%;accent-color:var(--ac);height:44px}
.score{font-family:var(--mincho);font-size:28px;font-weight:700;text-align:center}
.muted{color:var(--sub);font-size:13px;line-height:1.6}
.loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:20;font-family:var(--mincho);font-size:20px}
.loading small{font-family:'Zen Kaku Gothic New',sans-serif;font-size:12px;color:var(--sub)}
.meal{display:flex;gap:10px;align-items:flex-start}
.meal .ph{flex:none;width:72px;height:72px;border-radius:10px;border:1px dashed var(--line2);background:#FFFEFC;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:0;cursor:pointer;color:var(--sub)}
.meal .ph img{width:100%;height:100%;object-fit:cover;display:block}
.meal .ph.has{border-style:solid}
.meal .ph input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.meal .body{flex:1;min-width:0}
.meal .body label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:500}
.meal .acts{display:flex;gap:4px;margin-top:2px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gallery button{padding:0;border:none;background:#EFECE6;border-radius:10px;overflow:hidden;aspect-ratio:1;position:relative;cursor:pointer}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px}
.viewer{position:fixed;inset:0;background:rgba(20,20,20,.94);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:78vh;border-radius:10px}
.viewer .cap{color:#fff;font-size:14px;margin-top:12px}
.viewer .close{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:22px;border:none;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="loading" id="loading">自分磨き手帳<small>読み込み中…</small></div>
<div class="wrap">
  <header class="top"><h1 id="title">今日</h1><div class="status" id="status" aria-live="polite"></div></header>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="写真"><button type="button" class="close" data-act="closeViewer" aria-label="閉じる"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><img id="viewerImg" alt=""><div class="cap" id="viewerCap"></div></div>
<nav class="tabs" aria-label="メニュー"><div class="in" id="tabs"></div></nav>

<script>
(function(){
'use strict';

/* ---------- 定数 ---------- */
var PROMPTS = [
'最近、自分をほめたいことは？','鏡を見て好きなところを3つ','理想の朝の過ごし方は？','体が喜ぶ食べものって何？','やめたい習慣とその理由',
'いちばん気になる体のパーツは？','10年後の自分にひとこと','最近うれしかったこと','ストレスを感じるのはどんな時？','ホッとできる時間はいつ？',
'今週チャレンジしたいこと','尊敬する人の好きなところ','自分の長所を5つ書く','つい言ってしまう言い訳は？','2週間前と変わったこと',
'似合う服・色ってなんだろう','今日いちばん感謝したい人','夜ふかしの原因は？','好きな体の動かし方は？','「自信がある」と言えることは？',
'苦手なことに一歩ふみ出すなら','人に言われてうれしかった言葉','理想の体になったら何をする？','自分へのごほうびリスト','手放したいモノ・コト',
'最近の食生活に点数をつけると？','1日のうちで好きな時間','30日続けて気づいたこと','次の30日の目標','今の自分に手紙を書く'
];
var VISION_Q = ['1年後、どんな自分になっていたい？','見た目で変えたいところは？','やめたい習慣は？','新しく始めたい習慣は？','理想の自分になったら、何をしたい？'];
var DEFAULT_HABITS = ['水1.5L','ストレッチ','スキンケア','湯船につかる','間食なし','24時までに寝る'];
var MOODS = ['つらい','いまいち','ふつう','よい','最高'];
var WD = ['日','月','火','水','木','金','土'];
var BODY_FIELDS = [['weight','体重','kg'],['fat','体脂肪','%'],['waist','ウエスト','cm'],['hip','ヒップ','cm'],['thigh','太もも','cm'],['arm','二の腕','cm']];

/* ---------- 日付 ---------- */
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function today(){return ymd(new Date())}
function monday(s){var d=parse(s);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function md(s){var d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()}

/* ---------- 保存（このiPhoneの中） ---------- */
var LS_KEY='jibun-techo-v1';
var docs={};            // key -> object
var timers={};

function lsRead(){try{var s=localStorage.getItem(LS_KEY);return s?JSON.parse(s):{}}catch(e){return {}}}
function lsWrite(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(docs));return true}
  catch(e){setStatus('保存できませんでした（容量不足）');return false}
}
function setStatus(t){var el=document.getElementById('status');el.textContent=t;}
function get(key){return docs[key]}
function put(key,obj){
  docs[key]=obj;
  clearTimeout(timers.save);
  timers.save=setTimeout(function(){if(lsWrite())setStatus('保存しました')},300);
}
window.addEventListener('pagehide',function(){lsWrite()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')lsWrite()});

function init(){
  docs=lsRead();
  // iPhoneが勝手にデータを消さないようにお願いしておく
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  openDB().then(function(){},function(){showBanner('この端末では写真を保存できません。')}).then(function(){
    document.getElementById('loading').style.display='none';
    boot();
  });
}

/* ---------- 写真（IndexedDB） ---------- */
var MEAL_NAMES={b:'朝',l:'昼',d:'夜',s:'間食'};
var idb=null, urlCache={};
function phKey(date,m){return date+'-'+m}
function openDB(){
  return new Promise(function(res,rej){
    if(!window.indexedDB){rej();return}
    var r=indexedDB.open('jibun-techo',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('photos')};
    r.onsuccess=function(){idb=r.result;res()};
    r.onerror=function(){rej()};
  });
}
function tx(mode,fn){
  return new Promise(function(res,rej){
    if(!idb){rej();return}
    var t=idb.transaction('photos',mode), st=t.objectStore('photos'), out;
    var req=fn(st);
    if(req)req.onsuccess=function(){out=req.result};
    t.oncomplete=function(){res(out)};
    t.onerror=t.onabort=function(){rej(t.error)};
  });
}
function getBlob(id){return tx('readonly',function(s){return s.get(id)})}
function getPhoto(id){
  if(urlCache[id])return Promise.resolve(urlCache[id]);
  return getBlob(id).then(function(b){if(!b)return null;urlCache[id]=URL.createObjectURL(b);return urlCache[id]},function(){return null});
}
function savePhoto(id,blob){
  if(urlCache[id]){URL.revokeObjectURL(urlCache[id]);delete urlCache[id]}
  return tx('readwrite',function(s){return s.put(blob,id)});
}
function deletePhoto(id){
  if(urlCache[id]){URL.revokeObjectURL(urlCache[id]);delete urlCache[id]}
  return tx('readwrite',function(s){return s.delete(id)});
}
function allPhotoKeys(){return tx('readonly',function(s){return s.getAllKeys()})}
function photoImg(date,m){return '<img data-ph="'+phKey(date,m)+'" alt="">'}
function photoAttrs(date,m){return ' data-v="'+phKey(date,m)+'"'}

/* 長い辺600px・だいたい60KB以下のJPEGにする */
function toBlobQ(c,q){return new Promise(function(r){c.toBlob(function(b){r(b)},'image/jpeg',q)})}
function shrinkCanvas(img){
  var max=600, w=img.naturalWidth||img.width, h=img.naturalHeight||img.height, r=Math.min(1,max/Math.max(w,h));
  var c=document.createElement('canvas');c.width=Math.round(w*r);c.height=Math.round(h*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  var q=0.6;
  function step(){return toBlobQ(c,q).then(function(b){if(b&&b.size>60000&&q>0.32){q-=0.08;return step()}return b})}
  return step();
}
function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=src})}
function shrink(file){
  var url=URL.createObjectURL(file);
  return loadImg(url).then(function(i){URL.revokeObjectURL(url);return shrinkCanvas(i)},function(e){URL.revokeObjectURL(url);throw e});
}
function blobToDataUrl(b){return new Promise(function(r,j){var f=new FileReader();f.onload=function(){r(f.result)};f.onerror=j;f.readAsDataURL(b)})}
function dataUrlToBlob(d){
  var p=d.split(','), bin=atob(p[1]), a=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:(p[0].match(/data:([^;]+)/)||[])[1]||'image/jpeg'});
}
function hydratePhotos(){
  var imgs=document.querySelectorAll('img[data-ph]');
  Array.prototype.forEach.call(imgs,function(im){
    getPhoto(im.dataset.ph).then(function(v){if(v&&document.body.contains(im))im.src=v});
  });
}
function openViewer(id,cap){
  getPhoto(id).then(function(v){
    if(!v)return;
    document.getElementById('viewerImg').src=v;
    document.getElementById('viewerImg').alt=cap;
    document.getElementById('viewerCap').textContent=cap;
    document.getElementById('viewer').classList.add('on');
  });
}
function onPhotoPicked(input){
  var file=input.files&&input.files[0];if(!file)return;
  var m=input.dataset.photo, date=state.date, id=phKey(date,m);
  setStatus('写真を保存中…');
  shrink(file).then(function(b){return savePhoto(id,b)}).then(function(){
    var e=entry(date);e.photos=e.photos||{};e.photos[m]=true;saveEntry(e);render(true);
  }).catch(function(){setStatus('写真を保存できませんでした')});
}

/* ---------- バックアップ（ファイル） ---------- */
function makeBackup(){
  return allPhotoKeys().catch(function(){return []}).then(function(keys){
    var photos={}, p=Promise.resolve();
    (keys||[]).forEach(function(k){
      p=p.then(function(){return getBlob(k)}).then(function(b){if(b)return blobToDataUrl(b).then(function(d){photos[k]=d})});
    });

function parseInBody(text){
  text=text.replace(/^﻿/,'');
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim()});
  if(lines.length<2)throw new Error('empty');
  var head=lines[0].split(',').map(function(h){return h.trim().replace(/^"|"$/g,'')});
  var idx={};Object.keys(IB_COLS).forEach(function(k){idx[k]=head.indexOf(IB_COLS[k])});
  if(idx.ts<0||idx.weight<0)throw new Error('format');
  var out=[];
  lines.slice(1).forEach(function(l){
    var c=l.split(',').map(function(x){return x.trim().replace(/^"|"$/g,'')});
    var ts=(c[idx.ts]||'').replace(/\D/g,'');if(ts.length<8)return;
    var r={ts:ts,date:ts.slice(0,4)+'-'+ts.slice(4,6)+'-'+ts.slice(6,8)};
    Object.keys(IB_COLS).forEach(function(k){if(k==='ts'||idx[k]<0)return;var v=parseFloat(c[idx[k]]);if(!isNaN(v))r[k]=v});
    out.push(r);
  });
  return out;
}
function importInBody(text){
  var rows=parseInBody(text), cur=get('inbody')||{list:[]}, map={}, added=0;
  var csvDates={};rows.forEach(function(r){csvDates[r.date]=true});
  // 同じ日に手入力した分は、CSVの正確な値に置き換える
  cur.list.forEach(function(r){if(!(r.manual&&csvDates[r.date]))map[r.ts]=r});
  rows.forEach(function(r){if(!map[r.ts])added++;map[r.ts]=r});
  var list=Object.keys(map).sort().map(function(k){return map[k]});
  put('inbody',{list:list});
  return added;
}

var GENERAL_TIPS=[
 ['食べる順番','野菜やスープから食べ始めると、早食いを防げて満足感も出やすくなります。'],
 ['タンパク質は毎食','肉・魚・卵・大豆製品を毎食少しずつ。筋肉を守りながら体脂肪を落とす土台になります。'],
 ['夜はゆっくり','寝る2〜3時間前までに食事を終えると、睡眠の質も上がりやすくなります。'],
 ['歩数をちょい足し','ひと駅歩く・階段を使うなど、日常の動きを増やすのが一番続けやすい運動です。'],
 ['飲み物にも注意','甘いカフェラテやジュースは意外と高カロリー。水やお茶をベースにすると楽に減らせます。'],
 ['体重は毎日同じ条件で','朝起きてトイレのあとなど、同じタイミングで測ると変化がわかりやすくなります。'],
 ['完璧より継続','1日食べすぎても気にしすぎずに。次の食事で整えれば大丈夫です。'],
 ['よく噛む','ひと口20〜30回を意識すると、少ない量でも満腹感を感じやすくなります。'],
 ['筋トレは週2〜3回','スクワットなど大きい筋肉を使う運動で、代謝が落ちにくい体を作れます。'],
 ['お酒は量を決めて','飲むなら量を先に決めて、おつまみは枝豆や刺身などタンパク質系を選ぶのがおすすめ。']
];
function weightSeries(){
  var m={};
  allEntries().forEach(function(e){var w=parseFloat(e.weight);if(!isNaN(w))m[e.date]=w});
  var ib=get('inbody');if(ib)ib.list.forEach(function(r){if(r.weight!=null&&m[r.date]==null)m[r.date]=r.weight});
  return Object.keys(m).sort().map(function(k){return {date:k,w:m[k]}});
}
function avgOf(arr){return arr.length?arr.reduce(function(a,b){return a+b},0)/arr.length:null}
function ibNear(list,days){ // 最新からdays日以上前で一番近い測定
  if(!list.length)return null;var last=list[list.length-1];
  for(var i=list.length-2;i>=0;i--){if(diffDays(list[i].date,last.date)>=days)return list[i]}
  return null;
}
function buildAdvice(){
  var out=[], p=profile(), sex=p.sex||'';
  var ib=get('inbody'), list=ib&&ib.list||[], last=list[list.length-1], prev=list.length>1?list[list.length-2]:null;
  var base=ibNear(list,21)||prev;
  var bmi=last&&last.bmi!=null?last.bmi:null;
  var height=(last&&last.bmi&&last.weight)?Math.sqrt(last.weight/last.bmi):null;
  var goal=parseFloat(p.goal.weightGoal);

  // 痩せすぎ防止
  if(bmi!=null&&bmi<18.5)out.push(['warn','これ以上の減量はおすすめしません','BMIが18.5を下回っています。体重を減らすより、しっかり食べて筋肉をつけることを優先しましょう。']);
  else if(height&&!isNaN(goal)&&goal/(height*height)<18.5)out.push(['warn','目標体重を見直してみて','目標体重だとBMIが18.5を下回ります。体重より、体脂肪率や見た目の変化を目標にするのがおすすめです。']);

  // InBodyの変化
  if(last&&base){
    var dW=last.weight-base.weight, dM=(last.smm!=null&&base.smm!=null)?last.smm-base.smm:null, dF=(last.fat!=null&&base.fat!=null)?last.fat-base.fat:null;
    var span=diffDays(base.date,last.date), lbl=(span>0?span+'日前（'+md(base.date)+'）の測定から':'前回の測定から');
    if(dM!=null&&dM<=-0.4&&dW<0)out.push(['warn','筋肉も一緒に減っています',lbl+'骨格筋量が'+Math.abs(dM).toFixed(1)+'kg減りました。食事を減らしすぎていないか確認して、タンパク質を毎食とり、週2〜3回の筋トレを入れましょう。']);
    else if(dF!=null&&dF<0&&dM!=null&&dM>=-0.1)out.push(['good','理想的な減り方です',lbl+'体脂肪が'+Math.abs(dF).toFixed(1)+'kg減って、筋肉はキープできています。今のやり方を続けましょう。']);
    if(dF!=null&&dF>=0.8)out.push(['tip','体脂肪が増えています',lbl+'体脂肪が'+dF.toFixed(1)+'kg増えました。間食や夜遅い食事、飲み物を一度見直してみましょう。']);
    if(dM!=null&&dM>=0.5&&!(dF!=null&&dF<0))out.push(['good','筋肉が増えています',lbl+'骨格筋量が'+dM.toFixed(1)+'kg増えました。体重が減らなくても、体は確実に変わっています。']);
  }
  if(last&&last.pbf!=null&&sex){
    var hi=sex==='f'?28:20, lo=sex==='f'?18:10;
    if(last.pbf>hi)out.push(['tip','体脂肪率は目安より少し高め','目安は'+lo+'〜'+hi+'%です。食事は「減らす」より「整える」を意識して、筋トレとウォーキングを組み合わせるのが近道です。']);
    else if(last.pbf>=lo)out.push(['good','体脂肪率は標準の範囲','いまは目安（'+lo+'〜'+hi+'%）の中です。ここからは体重の数字より、見た目や体の軽さを大事にしていきましょう。']);
  }
  if(last&&last.vfl!=null&&last.vfl>=10)out.push(['warn','内臓脂肪が多めです','内臓脂肪レベルが'+last.vfl+'です。ウォーキングなどの有酸素運動と、お酒・甘いものを控えるのが効果的です。']);

  // 体重のペース
  var ws=weightSeries();
  if(ws.length>=2){
    var lw=ws[ws.length-1], pw=null;
    for(var i=ws.length-2;i>=0;i--){if(diffDays(ws[i].date,lw.date)>=14){pw=ws[i];break}}
    if(pw&&diffDays(pw.date,lw.date)<=60){
      var weeks=diffDays(pw.date,lw.date)/7, rate=(lw.w-pw.w)/pw.w/weeks*100;
      if(rate<-1)out.push(['warn','ペースが速すぎるかも','1週間に体重の1%以上減っています。急な減量は筋肉が落ちたりリバウンドしやすいので、もう少しゆっくりで大丈夫です。']);
      var recent=ws.filter(function(x){return diffDays(x.date,lw.date)<=21});
      if(recent.length>=5){var mx=Math.max.apply(null,recent.map(function(x){return x.w})),mn=Math.min.apply(null,recent.map(function(x){return x.w}));
        if(mx-mn<=0.6&&!isNaN(goal)&&lw.w>goal+0.5)out.push(['tip','停滞期かもしれません','3週間ほど体重が横ばいです。体が慣れてきたサインなので、やめずに続けるのが一番。運動の種類を少し変えてみるのもおすすめです。']);}
    }
  }

  // ここ7日の記録
  var t=today(), wk=[];for(var d=0;d<7;d++){var e=get('d-'+addDays(t,-d));if(hasContent(e))wk.push(e)}
  if(wk.length<3)out.push(['tip','まずは記録を習慣に','ここ7日で記録したのは'+wk.length+'日です。全部書かなくても、体重だけ・写真1枚だけでもOK。続けることが一番の近道です。']);
  else{
    var sl=wk.map(function(e){return parseFloat(e.sleep)}).filter(function(x){return !isNaN(x)}), sa=avgOf(sl);
    if(sl.length>=3&&sa<6)out.push(['tip','睡眠が少なめです','ここ最近の平均は'+sa.toFixed(1)+'時間。寝不足だと食欲が増えやすくなるので、まずは30分早く寝ることから。']);
    var wa=wk.filter(function(e){return e.water}).map(function(e){return e.water}), wav=avgOf(wa);
    if(wa.length>=3&&wav<5)out.push(['tip','水分を少し増やしてみて','1日平均'+(wav*0.2).toFixed(1)+'Lです。食事以外に1.2〜1.5Lくらいを目安に、こまめに飲みましょう。']);
    var snack=p.habits.filter(function(h){return /間食/.test(h)})[0];
    if(snack){var n=wk.filter(function(e){return e.habits&&e.habits[snack]}).length;
      if(n<=2)out.push(['tip','間食がポイントかも','ここ7日で「'+snack+'」ができたのは'+n+'日。食べるならナッツやヨーグルト、ゆで卵などに置き換えるのがおすすめです。']);}
    var hr=avgOf(wk.map(habitRate));
    if(hr>=0.7)out.push(['good','習慣がしっかり続いています','ここ7日の習慣の達成は'+Math.round(hr*100)+'%。この調子です！']);
  }

  var order={warn:0,tip:1,good:2};
  out.sort(function(a,b){return order[a[0]]-order[b[0]]});
  out=out.slice(0,4);
  if(out.length<2){var g=GENERAL_TIPS[Math.abs(diffDays('2026-01-01',t))%GENERAL_TIPS.length];out.push(['tip',g[0],g[1]])}
  return out;
}

}

  h+='<section class="card"><h2>理想の私</h2><p class="muted" style="margin:0">なりたい自分を言葉にしておこう。迷ったときに読み返す場所です。</p>';
  VISION_Q.forEach(function(q,i){
    h+='<div class="vq"><em>'+pad(i+1)+'</em><label for="v'+i+'">'+q+'</label></div><textarea id="v'+i+'" class="short" data-v="'+i+'">'+esc(p.vision[i])+'</textarea>';
  });
  h+='</section>';

  h+='<section class="card"><h2>からだの目標</h2>';
  h+='<div class="field" style="margin-bottom:12px"><label>性別（体脂肪率の目安に使います）</label><div class="seg" role="group" aria-label="性別">';
  [['f','女性'],['m','男性']].forEach(function(o){h+='<button type="button" data-act="setSex" data-v="'+o[0]+'" aria-pressed="'+(p.sex===o[0])+'">'+o[1]+'</button>'});
  h+='</div></div><div class="grid2">';
  [['weightNow','体重（はじめ）','kg'],['weightGoal','体重（目標）','kg'],['fatNow','体脂肪（はじめ）','%'],['fatGoal','体脂肪（目標）','%'],['waistNow','ウエスト（はじめ）','cm'],['waistGoal','ウエスト（目標）','cm']].forEach(function(f){
    h+='<div class="field"><label for="g'+f[0]+'">'+f[1]+'</label><div class="unit"><input id="g'+f[0]+'" type="number" inputmode="decimal" step="0.1" data-g="'+f[0]+'" value="'+esc(g[f[0]])+'"><span>'+f[2]+'</span></div></div>';
  });
  h+='</div><div class="field" style="margin-top:10px"><label for="gdeadline">いつまでに</label><input id="gdeadline" type="date" data-g="deadline" value="'+esc(g.deadline)+'"></div>';
  if(g.deadline){var left=diffDays(today(),g.deadline);h+='<p class="muted" style="margin:8px 0 0">期限まで あと <b style="color:var(--ink)">'+Math.max(0,left)+'日</b></p>'}
  h+='</section>';

  h+='<section class="card"><h2>続いたら、ごほうび</h2>';
  ['1週間つづいたら','1か月つづいたら','目標を達成したら'].forEach(function(l,i){
    h+='<div class="field" style="margin-bottom:10px"><label for="r'+i+'">'+l+'</label><input id="r'+i+'" type="text" data-r="'+i+'" value="'+esc(p.rewards[i])+'"></div>';
  });
  h+='</section>';

  h+='<section class="card" id="habits"><h2>習慣チェックの項目</h2>';
  p.habits.forEach(function(hb,i){
    h+='<div class="habit-row"><label class="sr" for="h'+i+'">項目'+(i+1)+'</label><input id="h'+i+'" type="text" data-h="'+i+'" value="'+esc(hb)+'"><button type="button" class="delbtn" data-act="delHabit" data-i="'+i+'" aria-label="'+esc(hb)+'を削除">'+ICON.x+'</button></div>';
  });
  h+='<button type="button" class="btn ghost" data-act="addHabit">＋ 項目を追加</button></section>';

  var body=get('body')||{list:[]};
  h+='<section class="card"><h2>ボディ記録<small>月1回がおすすめ</small></h2>';
  if(body.list.length){
    h+='<div class="scroll"><table class="body"><thead><tr><th>日付</th>'+BODY_FIELDS.map(function(f){return '<th>'+f[1]+'</th>'}).join('')+'<th></th></tr></thead><tbody>';
    body.list.slice().sort(function(a,b){return a.date<b.date?1:-1}).forEach(function(r){
      h+='<tr><td>'+esc(r.date.slice(5).replace('-','/'))+'</td>'+BODY_FIELDS.map(function(f){return '<td>'+(r[f[0]]!==''&&r[f[0]]!=null?esc(r[f[0]]):'—')+'</td>'}).join('')+'<td><button type="button" class="linkbtn" data-act="delBody" data-v="'+esc(r.id)+'" aria-label="'+esc(r.date)+'の記録を削除">削除</button></td></tr>';
    });
    h+='</tbody></table></div>';
  }else h+='<p class="muted" style="margin:0 0 8px">まだ記録がありません。</p>';
  h+='<div class="field" style="margin-top:10px"><label for="bdate">測った日</label><input id="bdate" type="date" value="'+today()+'"></div><div class="grid3" style="margin-top:10px">';
  BODY_FIELDS.forEach(function(f){h+='<div class="field"><label for="b'+f[0]+'">'+f[1]+'（'+f[2]+'）</label><input id="b'+f[0]+'" type="number" inputmode="decimal" step="0.1"></div>'});
  h+='</div><div style="margin-top:12px"><button type="button" class="btn" data-act="addBody">記録する</button></div></section>';

  h+='<section class="card"><h2>30日のお題</h2><ul class="plist">';
  var answered={};allEntries().forEach(function(e){if(e.answer)answered[e.prompt]=true});
  PROMPTS.forEach(function(q,i){h+='<li><span class="n">'+pad(i+1)+'</span><span>'+esc(q)+'</span>'+(answered[i]?'<span class="ok">書いた</span>':'')+'</li>'});
  h+='</ul></section>';

  h+='<section class="card"><h2>データのバックアップ</h2><p class="muted" style="margin:0 0 10px">記録と写真はこのiPhoneの中だけに保存されています。月に1回くらい「バックアップを保存」でファイルにしてOneDriveなどに入れておくと、機種変更のときも引き継げます。</p>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn ghost" data-act="saveBackup">バックアップを保存</button><label class="btn ghost" style="display:inline-flex;align-items:center;position:relative;overflow:hidden">ファイルから復元<input type="file" accept="application/json,.json" data-restore="1" style="position:absolute;inset:0;opacity:0"></label></div>';
  h+='<div style="margin-top:6px"><button type="button" class="linkbtn" data-act="showImport">コピーしたデータを貼り付けて読み込む</button></div>';
  h+='<div id="importBox" style="display:none;margin-top:6px"><label class="sr" for="importText">貼り付け</label><textarea id="importText" placeholder="Claude版の「データをコピー」で写したものを貼り付け"></textarea><div style="margin-top:8px"><button type="button" class="btn" data-act="doImport">読み込む</button></div></div>';
  h+='<p class="muted" id="bkMsg" style="margin:8px 0 0"></p></section>';
  return h;
}

/* ---------- 操作 ---------- */
function onClick(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.tab){state.tab=b.dataset.tab;render();return}
  var a=b.dataset.act;if(!a)return;
  var e, p=profile();
  switch(a){
    case 'viewPhoto':openViewer(b.dataset.v,b.dataset.cap||'');break;
    case 'closeViewer':document.getElementById('viewer').classList.remove('on');break;
    case 'delPhoto':
      e=entry(state.date);var pm=b.dataset.v;
      deletePhoto(phKey(state.date,pm)).then(function(){},function(){});
      if(e.photos)delete e.photos[pm];saveEntry(e);render(true);break;
    case 'prevDay':state.date=addDays(state.date,-1);render();break;
    case 'nextDay':if(state.date<today()){state.date=addDays(state.date,1);render()}break;
    case 'goToday':state.date=today();render();break;
    case 'nextPrompt':e=entry(state.date);e.prompt=(e.prompt+1)%30;saveEntry(e);render(true);break;
    case 'mood':e=entry(state.date);var mv=+b.dataset.v;e.mood=e.mood===mv?0:mv;saveEntry(e);render(true);break;
    case 'water':e=entry(state.date);var wv=+b.dataset.v;e.water=e.water===wv?wv-1:wv;saveEntry(e);render(true);break;
    case 'habit':e=entry(state.date);var hn=p.habits[+b.dataset.i];e.habits=e.habits||{};e.habits[hn]=!e.habits[hn];saveEntry(e);render(true);break;
    case 'goHabits':state.tab='me';render();var el=document.getElementById('habits');if(el)el.scrollIntoView();break;
    case 'ibToggleForm':state.ibForm=!state.ibForm;render(true);break;
    case 'ibToggleHist':state.ibHist=!state.ibHist;render(true);break;
    case 'ibSaveManual':
      var dv=document.getElementById('ibDate').value, tv=document.getElementById('ibTime').value||'00:00';
      var wEl=document.getElementById('ibf_weight'), wv=parseFloat(wEl.value);
      var ibm=document.getElementById('ibMsg');
      if(!dv||isNaN(wv)){if(ibm)ibm.textContent='測定日と体重を入れてください。';wEl.focus();break}
      var row={ts:dv.replace(/-/g,'')+tv.replace(':','')+'00',date:dv,manual:true};
      IB_METRICS.forEach(function(m){var v=parseFloat(document.getElementById('ibf_'+m[0]).value);if(!isNaN(v))row[m[0]]=v});
      var cur=get('inbody')||{list:[]};
      cur.list=cur.list.filter(function(r){return r.ts!==row.ts});cur.list.push(row);
      cur.list.sort(function(a,b){return a.ts<b.ts?-1:1});
      put('inbody',cur);state.ibForm=false;render(true);
      var ibm2=document.getElementById('ibMsg');if(ibm2)ibm2.textContent=dv.replace(/-/g,'/')+' の測定を追加しました。';
      break;
    case 'ibDel':
      if(b.dataset.sure){var c2=get('inbody');if(c2){c2.list=c2.list.filter(function(r){return r.ts!==b.dataset.v});if(c2.list.length)put('inbody',c2);else{delete docs.inbody;lsWrite()}render(true)}}
      else{b.dataset.sure='1';b.textContent='本当に消す'}
      break;
    case 'setSex':p.sex=p.sex===b.dataset.v?'':b.dataset.v;put('profile',p);render(true);break;
    case 'goRec':state.tab='rec';render();break;
    case 'ibMetric':state.ibMetric=b.dataset.v;render(true);break;
    case 'ibClear':
      if(b.dataset.sure){delete docs.inbody;lsWrite();render(true);setStatus('InBodyのデータを消しました')}
      else{b.dataset.sure='1';b.textContent='本当に消す（もう一度タップ）'}
      break;
    case 'prevMonth':var d1=parse(state.month+'-01');d1.setMonth(d1.getMonth()-1);state.month=ymd(d1).slice(0,7);render(true);break;
    case 'nextMonth':var d2=parse(state.month+'-01');d2.setMonth(d2.getMonth()+1);state.month=ymd(d2).slice(0,7);render(true);break;
    case 'openDay':state.date=b.dataset.v;state.tab='today';render();break;
    case 'prevWeek':state.week=addDays(state.week,-7);render();break;
    case 'nextWeek':if(state.week<monday(today())){state.week=addDays(state.week,7);render()}break;
    case 'addHabit':p.habits.push('新しい習慣');put('profile',p);render(true);var inp=document.getElementById('h'+(p.habits.length-1));if(inp){inp.focus();inp.select()}break;
    case 'delHabit':p.habits.splice(+b.dataset.i,1);put('profile',p);render(true);break;
    case 'addBody':
      var body=get('body')||{list:[]}, rec={id:'b'+Date.now(),date:document.getElementById('bdate').value||today()}, any=false;
      BODY_FIELDS.forEach(function(f){var v=document.getElementById('b'+f[0]).value;rec[f[0]]=v;if(v!=='')any=true});
      if(!any){document.getElementById('bweight').focus();break}
      body.list.push(rec);put('body',body);render(true);break;
    case 'delBody':var bd=get('body');if(bd){bd.list=bd.list.filter(function(r){return r.id!==b.dataset.v});put('body',bd);render(true)}break;
    case 'saveBackup':
      var msg=document.getElementById('bkMsg');msg.textContent='作成中…';
      makeBackup().then(function(o){
        var name='jibun-techo-'+today()+'.json';
        var file=new File([JSON.stringify(o)],name,{type:'application/json'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){
          return navigator.share({files:[file],title:name}).then(function(){msg.textContent='保存しました。'},function(){msg.textContent=''});
        }
        var a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
        msg.textContent='ダウンロードしました。';
      }).catch(function(){msg.textContent='作成できませんでした。'});
      break;
    case 'showImport':var ib=document.getElementById('importBox');ib.style.display=ib.style.display==='none'?'block':'none';break;
    case 'doImport':
      var m2=document.getElementById('bkMsg');
      try{
        var o=JSON.parse(document.getElementById('importText').value);
        restoreBackup(o).then(function(){render(true);document.getElementById('bkMsg').textContent='読み込みました。'});
      }catch(x){m2.textContent='読み込めませんでした。コピーしたデータをそのまま貼ってください。'}
      break;
  }
}
function onInput(ev){
  var t=ev.target, d=t.dataset, e, p;
  if(d.f!==undefined){e=entry(state.date);e[d.f]=t.value;saveEntry(e);return}
  if(d.meal){e=entry(state.date);e.meals[d.meal]=t.value;saveEntry(e);return}
  if(d.w){var k='w-'+state.week, wk=get(k)||{good:'',next:'',score:''};wk[d.w]=t.value;put(k,wk);if(d.w==='score')document.getElementById('scoreView').textContent=t.value+' 点';return}
  p=profile();
  if(d.v!==undefined){p.vision[+d.v]=t.value;put('profile',p);return}
  if(d.g){p.goal[d.g]=t.value;put('profile',p);return}
  if(d.r!==undefined){p.rewards[+d.r]=t.value;put('profile',p);return}
  if(d.h!==undefined){
    var i=+d.h, old=p.habits[i], nv=t.value;
    p.habits[i]=nv;put('profile',p);
    // 名前を変えたら今日の記録のチェックも引き継ぐ
    var te=get('d-'+today());if(te&&te.habits&&old in te.habits){te.habits[nv]=te.habits[old];delete te.habits[old];saveEntry(te)}
    return;
  }
}

function boot(){
  document.addEventListener('click',onClick);
  document.addEventListener('input',onInput);
  document.addEventListener('change',function(ev){if(ev.target.dataset.photo){onPhotoPicked(ev.target);return}
    if(ev.target.dataset.inbody){
      var fi=ev.target.files&&ev.target.files[0];if(!fi)return;
      fi.text().then(function(t){
        var n=importInBody(t);render(true);
        var mm=document.getElementById('ibMsg');if(mm)mm.textContent=n?n+'回分の測定を取り込みました。':'新しい測定はありませんでした。';
      }).catch(function(){var mm=document.getElementById('ibMsg');if(mm)mm.textContent='このファイルは読み込めませんでした。InBodyアプリから書き出したCSVを選んでください。'});
      return;
    }
    if(ev.target.dataset.restore){
      var f=ev.target.files&&ev.target.files[0], msg=document.getElementById('bkMsg');if(!f)return;
      f.text().then(function(t){return restoreBackup(JSON.parse(t))}).then(function(){render(true);document.getElementById('bkMsg').textContent='復元しました。'},function(){msg.textContent='このファイルは読み込めませんでした。'});
      return;
    }if(ev.target.dataset.g==='deadline'&&state.tab==='me')render(true)});
  if(!get('profile'))put('profile',profile());
  render();
}
init();
})();
</script>
</body>
